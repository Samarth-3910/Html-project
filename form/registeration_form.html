<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <div>
        <h1>Registration Form</h1>
        <form action="#" method="POST" enctype="multipart/form-data">
            <div>
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            <br>
            <div>
                <label for="age">Age:</label>
                <input type="number" id="age" name="age" min="1">
            </div>
            <br>
            <div>
                <label>Gender:</label>
                <div>
                    <div>
                        <input type="radio" id="male" name="gender" value="male">
                        <label for="male">Male</label>
                    </div>
                    <div>
                        <input type="radio" id="female" name="gender" value="female">
                        <label for="female">Female</label>
                    </div>
                    <div>
                        <input type="radio" id="other" name="gender" value="other">
                        <label for="other">Other</label>
                    </div>
                </div>
            </div>
            <br>
            <div>
                <label for="country">Country:</label>
                <select id="country" name="country" required>
                    <option value="">Select your country</option>
                    <option value="us">United States</option>
                    <option value="uk">United Kingdom</option>
                    <option value="ca">Canada</option>
                    <option value="au">Australia</option>
                    <option value="de">Germany</option>
                    <option value="fr">France</option>
                    <option value="jp">Japan</option>
                    <option value="in">India</option>
                    <option value="br">Brazil</option>
                    <option value="other">Other</option>
                </select>
            </div>
            <br>
            <div>
                <label for="skills">Skills:</label>
                <input type="checkbox" id="html" name="skills" value="html"> HTML
                <input type="checkbox" id="css" name="skills" value="css">CSS
                <input type="checkbox" id="js" name="skills" value="js">JavaScript
                <input type="checkbox" id="php" name="skills" value="php">PHP
                <input type="checkbox" id="python" name="skills" value="python">Python
            </div>
            <br>
            <div>
                <label for="resume">Upload Resume:</label>
                <input type="file" id="resume" name="resume" accept=".pdf" required>
            </div>
            <br>
                <input type="submit" value="Register">
        </form>
    </div>
</body>
</html>
