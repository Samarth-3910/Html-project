<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="form-container">
        <h2 class="form-title">Personal Information</h2>
        <form id="personalForm">
            <div class="section-container personal-info">
                <div class="section-header">Personal Information</div>
                <div class="section-content">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Phone Number</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Enter your message here..." required></textarea>
                    </div>
                </div>
            </div>

            <div class="section-container job-details">
                <div class="section-header">Job Details</div>
                <div class="section-content">
                    <div class="form-group">
                        <label for="position">Position Applied For</label>
                        <select id="position" name="position" required>
                            <option value="">Select a position</option>
                            <option value="software-developer">Software Developer</option>
                            <option value="frontend-developer">Frontend Developer</option>
                            <option value="backend-developer">Backend Developer</option>
                            <option value="fullstack-developer">Full Stack Developer</option>
                            <option value="web-designer">Web Designer</option>
                            <option value="ui-ux-designer">UI/UX Designer</option>
                            <option value="project-manager">Project Manager</option>
                            <option value="data-analyst">Data Analyst</option>
                            <option value="marketing-specialist">Marketing Specialist</option>
                            <option value="sales-representative">Sales Representative</option>
                            <option value="customer-support">Customer Support</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="experience">Years of Experience</label>
                        <input type="number" id="experience" name="experience" min="0" max="50" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="coverLetter">Cover Letter</label>
                        <textarea id="coverLetter" name="coverLetter" placeholder="Please write your cover letter here..." rows="8" required></textarea>
                    </div>
                </div>
            </div>

            <div class="section-container availability">
                <div class="section-header">Availability</div>
                <div class="section-content">
                    <div class="form-group">
                        <label for="startDate">Available Start Date</label>
                        <input type="date" id="startDate" name="startDate" class="date-input" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Ready to Relocate</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="relocate" value="yes" required>
                                Yes
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="relocate" value="no" required>
                                No
                            </label>
                        </div>
                    </div>
                </div>
            </div>

            <button type="submit" class="submit-btn">Submit Application</button>
        </form>
    </div>
</body>
</html>
